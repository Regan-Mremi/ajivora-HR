<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ajivora — Enterprise Suite</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            dark: {
              950: '#0a0a0f',
              900: '#0f1117',
              800: '#161b22',
              700: '#1c2333',
              600: '#252d3d',
            }
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Inter', system-ui, sans-serif; }
    .sidebar-item.active { background: rgba(59, 130, 246, 0.15); color: #60a5fa; }
    .sidebar-item:hover:not(.active) { background: rgba(255,255,255,0.05); }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .progress-bar { height: 6px; border-radius: 3px; }
    input, select, textarea { background: #161b22 !important; border-color: #2a3344 !important; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #3b82f6 !important; box-shadow: 0 0 0 2px rgba(59,130,246,0.2); }
  </style>
  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- jsPDF for contract PDF generation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body class="bg-dark-950 text-gray-200 min-h-screen">

  <!-- ==================== LOGIN / AUTH SCREEN ==================== -->
  <div id="auth-screen" class="fixed inset-0 z-50 flex items-center justify-center bg-dark-950">
    <div class="w-full max-w-md p-8">
      <div class="text-center mb-8">
        <div class="inline-flex items-center gap-3 mb-4">
          <div class="w-10 h-10 rounded-lg bg-blue-600 flex items-center justify-center font-bold text-white text-sm">HR</div>
          <div class="text-left">
            <div class="font-semibold text-white text-lg">Ajivora</div>
            <div class="text-xs text-gray-500">Enterprise Suite</div>
          </div>
        </div>
        <h1 class="text-2xl font-semibold text-white mt-4" id="auth-title">Sign in to your account</h1>
        <p class="text-sm text-gray-500 mt-1" id="auth-subtitle">HR Director access only</p>
      </div>

      <form id="auth-form" class="space-y-4" autocomplete="off" onsubmit="return false;">
        <div>
          <label class="block text-xs text-gray-400 mb-1.5">Email</label>
          <input type="email" id="auth-email" name="email" autocomplete="off"
            class="w-full px-4 py-2.5 rounded-lg border text-sm text-white placeholder-gray-500"
            placeholder="you@company.com" />
        </div>
        <div>
          <label class="block text-xs text-gray-400 mb-1.5">Password</label>
          <input type="password" id="auth-password" name="password" autocomplete="new-password"
            class="w-full px-4 py-2.5 rounded-lg border text-sm text-white placeholder-gray-500"
            placeholder="••••••••" />
        </div>
        <div id="auth-error" class="hidden text-sm text-red-400 bg-red-500/10 border border-red-500/20 rounded-lg px-3 py-2"></div>
        <button type="button" id="auth-submit"
          class="w-full py-2.5 rounded-lg bg-blue-600 hover:bg-blue-500 text-white font-medium text-sm transition disabled:opacity-50 disabled:cursor-not-allowed">
          Sign In
        </button>
      </form>

      <p class="text-center text-xs text-gray-500 mt-6">
        <span id="auth-toggle-text">Don't have an account?</span>
        <button type="button" id="auth-toggle" class="text-blue-400 hover:text-blue-300 ml-1">Register</button>
      </p>
      <p class="text-center text-[10px] text-gray-600 mt-4">Only one user can be registered (enforced in Supabase)</p>
    </div>
  </div>

  <!-- ==================== MAIN APP ==================== -->
  <div id="app" class="hidden flex h-screen overflow-hidden">

    <!-- SIDEBAR -->
    <aside class="w-56 bg-dark-900 border-r border-dark-700 flex flex-col shrink-0">
      <!-- Logo -->
      <div class="px-4 py-5 border-b border-dark-700 flex items-center gap-3">
        <div class="w-8 h-8 rounded-md bg-blue-600 flex items-center justify-center font-bold text-white text-xs">HR</div>
        <div>
          <div class="font-semibold text-white text-sm">Ajivora</div>
          <div class="text-[10px] text-gray-500">Enterprise Suite</div>
        </div>
      </div>

      <!-- Nav -->
      <nav class="flex-1 overflow-y-auto py-4 px-2 space-y-6">
        <div>
          <div class="px-2 text-[10px] font-medium text-gray-500 uppercase tracking-wider mb-2">Overview</div>
          <button data-page="dashboard" class="sidebar-item active w-full flex items-center gap-3 px-2 py-2 rounded text-sm text-left">
            <span class="text-base w-5 text-center">▣</span>
            <span>Dashboard</span>
          </button>
        </div>

        <div>
          <div class="px-2 text-[10px] font-medium text-gray-500 uppercase tracking-wider mb-2">People</div>
          <button data-page="employees" class="sidebar-item w-full flex items-center gap-3 px-2 py-2 rounded text-sm text-left text-gray-400">
            <span class="text-base w-5 text-center">◎</span>
            <span>Employees</span>
          </button>
          <button data-page="profile" class="sidebar-item w-full flex items-center gap-3 px-2 py-2 rounded text-sm text-left text-gray-400">
            <span class="text-base w-5 text-center">◉</span>
            <span>Employee Profile</span>
          </button>
          <button data-page="contract" class="sidebar-item w-full flex items-center gap-3 px-2 py-2 rounded text-sm text-left text-gray-400">
            <span class="text-base w-5 text-center">◧</span>
            <span>Contract Form</span>
          </button>
          <button data-page="contracts" class="sidebar-item w-full flex items-center gap-3 px-2 py-2 rounded text-sm text-left text-gray-400">
            <span class="text-base w-5 text-center">📄</span>
            <span>Contracts</span>
          </button>
          <button data-page="departments" class="sidebar-item w-full flex items-center gap-3 px-2 py-2 rounded text-sm text-left text-gray-400">
            <span class="text-base w-5 text-center">▦</span>
            <span>Departments</span>
          </button>
        </div>

        <div>
          <div class="px-2 text-[10px] font-medium text-gray-500 uppercase tracking-wider mb-2">Operations</div>
          <button data-page="payroll" class="sidebar-item w-full flex items-center gap-3 px-2 py-2 rounded text-sm text-left text-gray-400">
            <span class="text-base w-5 text-center">◈</span>
            <span>Payroll</span>
          </button>
          <button data-page="attendance" class="sidebar-item w-full flex items-center gap-3 px-2 py-2 rounded text-sm text-left text-gray-400">
            <span class="text-base w-5 text-center">◷</span>
            <span>Attendance</span>
          </button>
          <button data-page="recruitment" class="sidebar-item w-full flex items-center gap-3 px-2 py-2 rounded text-sm text-left text-gray-400">
            <span class="text-base w-5 text-center">◌</span>
            <span>Recruitment</span>
          </button>
          <button data-page="performance" class="sidebar-item w-full flex items-center gap-3 px-2 py-2 rounded text-sm text-left text-gray-400">
            <span class="text-base w-5 text-center">◆</span>
            <span>Performance</span>
          </button>
        </div>

        <div>
          <div class="px-2 text-[10px] font-medium text-gray-500 uppercase tracking-wider mb-2">Development</div>
          <button data-page="training" class="sidebar-item w-full flex items-center gap-3 px-2 py-2 rounded text-sm text-left text-gray-400">
            <span class="text-base w-5 text-center">◑</span>
            <span>Training</span>
          </button>
        </div>
      </nav>

      <!-- User -->
      <div class="p-3 border-t border-dark-700">
        <div class="flex items-center gap-3">
          <div class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center text-xs font-medium text-white">JD</div>
          <div class="flex-1 min-w-0">
            <div class="text-sm font-medium text-white truncate" id="user-name">Judith</div>
            <div class="text-[10px] text-gray-500">HR Director</div>
          </div>
          <button id="logout-btn" title="Sign out" class="text-gray-500 hover:text-red-400 text-sm">⎋</button>
        </div>
      </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="flex-1 overflow-y-auto bg-dark-950">
      <div id="page-content" class="p-8 max-w-7xl mx-auto"></div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
